[project]
name = "organize-tasks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cassi35", email = "cgrsobral@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
organize-tasks = "organize_tasks:main"


[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/english_news",
    "apps/*",
]
exclude = ["apps/node_modules", "apps/ui","packages/*/__pycache__"]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "sqlalchemy>=2.0.51",
    "testcontainers[postgresql]>=4.15.0",
]
[tool.pytest.ini_options]
markers = [
    "integration: testes de integracao com banco de dados",
    "unit: testes unitarios isolados",
]