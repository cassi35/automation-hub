[project]
name = "automation-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cassi35", email = "cgrsobral@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.6.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "openai>=3.0.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "shared",
]
[tool.uv.sources]
shared = { workspace = true }
[project.scripts]
automation-agent = "automation_agent:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
