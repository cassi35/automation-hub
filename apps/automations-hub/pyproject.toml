[project]
name = "automations-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cassi35", email = "cgrsobral@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "feedparser>=6.0.12",
    "prompt-toolkit>=3.0.52",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "shared"
]
[tool.uv.sources]
shared = { workspace = true }
[project.scripts]
automations-hub = "automations_hub.main:main"


[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "pytest>=9.1.1",
    "testcontainers[postgresql]>=4.15.0",
]
