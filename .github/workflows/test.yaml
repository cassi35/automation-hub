name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --all-packages
      - name: Listar arquivos de teste
        run: |
          pwd
          find . -name "*test*.py"
      - name: Rodar testes unitários
        run: uv run pytest -m unit -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --all-packages
      - name: Listar arquivos de teste
        run: |
          pwd
          find . -name "*test*.py"
      - name: Rodar testes de integração
        run: uv run pytest -m integration -v
  performance:
    name: performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --all-packages
      - name: Listar arquivos de teste
        run: |
          pwd
          find . -name "*test*.py"
      - name: Rodar testes de performance
        run: uv run pytest -s -m performance -v
  deploy-db:
    name: Deploy Database Migrations
    runs-on: ubuntu-latest
    needs: [unit, integration, performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --all-packages

      - name: Rodar migrations no banco de produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd apps/automations-hub
          uv run alembic upgrade head
